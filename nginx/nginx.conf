# Redirect HTTP to HTTPS for both domains
server {
    listen 80;
    server_name it-tat.uz www.it-tat.uz api.it-tat.uz;
    return 301 https://$host$request_uri;
}

# Frontend: it-tat.uz
server {
    listen 443 ssl http2;
    server_name it-tat.uz www.it-tat.uz;

    ssl_certificate     /etc/letsencrypt/live/it-tat.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/it-tat.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # optional HSTS for main domain
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Proxy to frontend container (localhost:8080)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout 90s;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|eot|ttf)$ {
        proxy_pass http://127.0.0.1:8080;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

# Backend API: api.it-tat.uz
server {
    listen 443 ssl http2;
    server_name api.it-tat.uz;

    ssl_certificate     /etc/letsencrypt/live/it-tat.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/it-tat.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 600M;

    # Static va media — agar host volume orqali xizmat qilmoqchi bo'lsangiz:
    location /static/ {
        alias /var/lib/docker/volumes/it_tat_project_static-data/_data/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /var/lib/docker/volumes/it_tat_project_media-data/_data/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 90s;
        proxy_read_timeout 90s;
        proxy_buffering off;
    }
}
