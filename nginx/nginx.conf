server {
    listen 80;
    server_name api.it-tat.uz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.it-tat.uz;

    client_max_body_size 600M;

    ssl_certificate     /etc/letsencrypt/live/it-tat.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/it-tat.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Agar static fayllarni host/nginx dan xizmat qilmoqchi bo'lsangiz, shu joyni to'g'rilang:
    location /static/ {
        alias /var/lib/docker/volumes/YOUR_PROJECT_static-data/_data/;
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /var/lib/docker/volumes/YOUR_PROJECT_media-data/_data/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8081;   # backend containerning host-mapped porti
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 90;
        proxy_read_timeout 90;
        proxy_buffering off;
    }
}
